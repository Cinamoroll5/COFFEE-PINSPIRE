<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coffee Gallery</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- Custom Theme -->
  <style>
    body {
      background-color: #3e2723; /* coffee brown */
      color: #fff;
    }

    .navbar {
      background: linear-gradient(90deg, #4e342e, #6d4c41);
    }

    .card {
      background-color: #5d4037;
      color: #fff;
      border: none;
      border-radius: 15px;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .btn-theme {
      background-color: #d2691e; /* chocolate */
      border: none;
    }

    .btn-theme:hover {
      background-color: #a0522d;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">
      ☕ MY COFFEE 🍫🍓
    </span>
    <a href="/ADD" class="btn btn-theme">➕ Add Coffee</a>
  </div>
</nav>

<!-- HEADER -->
<h1>☕ Coffee Gallery 🍫🍓</h1>
<h1>🧋🍦🥯❄🍨🍓🍫</h1>

<div class="container mt-4">
  <div class="row g-4">

    {% for coffee in allcoffeessss %}

    <!-- CARD -->
    <div class="col-md-4 col-sm-6">
      <div class="card shadow">

        <img
          src="{{url_for('static',filename='images/'+coffee.imagename)}}"
          class="card-img-top"
          alt="coffee image"
        />

        <div class="card-body">
          <h5 class="card-title">☕ {{coffee.name}}</h5>
          <p class="card-text">{{coffee.description}}</p>

          <!-- Button -->
          <button
            type="button"
            class="btn btn-theme w-100"
            data-bs-toggle="modal"
            data-bs-target="#modal{{loop.index}}"
          >
            🍫 See Ingredients
          </button>
        </div>
      </div>
    </div>

    <!-- MODAL (UNIQUE ID) -->
    <div
      class="modal fade"
      id="modal{{loop.index}}"
      tabindex="-1"
    >
      <div class="modal-dialog">
        <div class="modal-content bg-dark text-white">

          <div class="modal-header">
            <h5 class="modal-title">
              🍓 Ingredients for {{coffee.name}}
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            
              <p>{{coffee.ingridients}}</p>
              
           
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Close
            </button>
          </div>

        </div>
      </div>
    </div>

    {% endfor %}

  </div>
</div>

</body>
</html>
