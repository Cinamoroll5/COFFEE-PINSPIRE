<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Coffee</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- Custom Theme -->
  <style>
    body {
      background-color: #3e2723; /* coffee */
      color: white;
    }

    .navbar {
      background: linear-gradient(90deg, #4e342e, #6d4c41);
    }

    .form-card {
      background-color: #5d4037;
      border-radius: 15px;
      padding: 25px;
    }

    .btn-theme {
      background-color: #d2691e; /* chocolate */
      border: none;
    }

    .btn-theme:hover {
      background-color: #a0522d;
    }

    h1, h5 {
      text-align: center;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">
      ☕ MY COFFEE 🍫🍓
    </span>
    <a href="/" class="btn btn-theme">🏠 Home</a>
  </div>
</nav>

<!-- HEADER -->
<h1 class="mt-4">➕ Add Coffee ☕</h1>
<h5>🍓 Share your favorite chocolate & coffee creations 🍫</h5>

<!-- FORM -->
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="form-card shadow">

        <form enctype="multipart/form-data" method="post">

          <div class="mb-3">
            <label class="form-label">☕ Coffee Name</label>
            <input 
              required 
              name="coffee" 
              class="form-control"
              placeholder="Iced Americano 🍹">
          </div>

          <div class="mb-3">
            <label class="form-label">📸 Picture</label>
            <input 
              required 
              name="image" 
              type="file" 
              class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">📝 Description</label>
            <input 
              required 
              name="description" 
              class="form-control"
              placeholder="Rich chocolate flavor 🍫">
          </div>

          <div class="mb-3">
            <label class="form-label">🍓 Ingredients</label>
            <input 
              required 
              name="ingridients" 
              class="form-control"
              placeholder="Coffee, Sugar, Water, Ice, Chocolate, Berries">
          </div>

          <button class="btn btn-theme w-100">
            💾 Save Coffee
          </button>

        </form>

      </div>

    </div>
  </div>
</div>

</body>
</html>
